<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="orb" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#8ef0dd"/>
      <stop offset="50%" stop-color="#3fbfa8"/>
      <stop offset="100%" stop-color="#0b5a52"/>
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="url(#orb)"/>
  <!-- Specular highlight: makes it read as a sphere rather than a disc. Soft
       gradient, not a hard ellipse — a hard one reads as a second object. -->
  <ellipse cx="23.5" cy="20.5" rx="9" ry="6" fill="url(#spec)"
           transform="rotate(-22 23.5 20.5)"/>
  <!-- The keyhole is filled with the page's own dark, not punched through to
       transparency: a hole reads as a hole only against a dark ground, and this
       has to survive a light browser tab bar too. -->
  <g fill="#0b1615">
    <circle cx="32" cy="28.5" r="5.6"/>
    <path d="M28.9 32.6h6.2l2.1 11.1a1.7 1.7 0 0 1-1.7 2h-7a1.7 1.7 0 0 1-1.7-2z"/>
  </g>
</svg>
